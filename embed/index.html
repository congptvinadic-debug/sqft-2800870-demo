<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed example</title>
<link rel="icon" href="data:,">
<style>
  /* the host site's own styles: the widget must not change them, and they must not break the widget */
  body { margin: 0; font: 16px/1.6 Georgia, serif; color: #222; background: #fff; }
  .site-header { background: #2d2d2d; color: #fff; padding: 14px 24px; font-weight: bold; }
  .site-footer { border-top: 1px solid #ddd; padding: 24px; color: #777; font-size: 14px; }
  .product { max-width: 1200px; margin: 0 auto; }
  h1 { color: #222; }
</style>
<link rel="stylesheet" href="./sqft-v3.css">
</head>
<body>
  <div class="site-header">Your existing store header</div>
  <div class="product">
    <div id="sqft-pricing" data-mode="demo" data-demo="false"></div>
  </div>
  <div class="site-footer">Your existing footer. Only the div above and two files were added to this page.</div>
  <script type="module" src="./sqft-v3.js"></script>
</body>
</html>
